services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://review:review@db:5432/review
      JWT_SECRET: ${JWT_SECRET:-fixed-dev-secret-for-compose}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpass}
      STATIC_DIR: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  verify:
    build:
      context: ./verify
    profiles: ["test"]
    environment:
      BASE_URL: http://api:8000
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpass}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
